<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Solicitar Entrada - Almoxarifado</title>
    <style>
        :root {
            --primary: #00437e;
            --primary-hover: #002d54;
            --success: #184a7a;
            --success-hover: #0f3254;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border: #cbd5e1;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url(/static/codigos/img1/fundo.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        /* Top Navigation */
        .top-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 67, 126, 0.3);
            transition: all 0.3s ease;
        }

        .voltar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 67, 126, 0.4);
        }

        /* Área Central do Formulário */
        .caixa-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        .caixa {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 30, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.7);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .caixa-icone {
            font-size: 44px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--primary);
            font-size: clamp(22px, 3.5vw, 28px);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitulo {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            padding: 12px 18px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--border);
            font-size: 16px;
            outline: none;
            background: #ffffff;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 67, 126, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
            font-size: 15px;
        }

        .btn-confirmar {
            margin-top: 10px;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--primary);
            color: white;
            font-size: 17px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0, 67, 126, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-confirmar:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 67, 126, 0.45);
        }

        .btn-confirmar:active {
            transform: translateY(0);
        }

        /* Rodapé */
        .page-footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* ========================================================
           MEDIA QUERIES - RESPONSIVIDADE
           ======================================================== */

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .caixa {
                padding: 30px 22px;
                border-radius: 16px;
            }

            input, .btn-confirmar {
                height: 48px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .voltar {
                font-size: 13px;
                padding: 8px 16px;
            }

            .caixa {
                padding: 24px 16px;
                border-radius: 14px;
            }

            .caixa-icone {
                font-size: 36px;
            }

            h2 {
                font-size: 20px;
            }

            input, .btn-confirmar {
                height: 46px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="{{ url_for('menu') }}" class="voltar">⬅ Voltar ao Menu</a>
    </header>

    <main class="caixa-wrapper">
        <div class="caixa">
            <h2>Solicitar Entrada</h2>

            <div class="form-group">
                <label for="produtoEntrada" class="form-label">Nome do Produto</label>
                <input 
                    type="text" 
                    id="produtoEntrada" 
                    placeholder="Ex: Teclado Mecânico"
                    onkeypress="if(event.key === 'Enter') confirmarEntrada();"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="qtdEntrada" class="form-label">Quantidade</label>
                <input 
                    type="number" 
                    id="qtdEntrada" 
                    placeholder="Ex: 10" 
                    min="1"
                    onkeypress="if(event.key === 'Enter') confirmarEntrada();"
                    required
                >
            </div>

            <button type="button" class="btn-confirmar" onclick="confirmarEntrada()">
                <span>Confirmar Entrada</span> ➔
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        async function confirmarEntrada(){
            var prod = document.getElementById("produtoEntrada").value.trim();
            var qtd = document.getElementById("qtdEntrada").value;

            if(!prod || !qtd){
                Swal.fire({
                    title: "Atenção",
                    text: "Por favor, preencha o nome do produto e a quantidade!",
                    icon: "warning"
                });
                return;
            }

            try {
                const resposta = await fetch("/api/movimentacao", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nome: prod,
                        tipo: "Entrada",
                        quantidade: parseInt(qtd)
                    })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    Swal.fire({
                        title: "Sucesso!",
                        text: dados.mensagem,
                        icon: "success"
                    });
                    document.getElementById("produtoEntrada").value = "";
                    document.getElementById("qtdEntrada").value = "";
                } else {
                    Swal.fire({
                        title: "Erro",
                        text: dados.mensagem,
                        icon: "error"
                    });
                }
            } catch (e) {
                console.error(e);
                Swal.fire({
                    title: "Erro",
                    text: "Falha ao se comunicar com o servidor!",
                    icon: "error"
                });
            }
        }
    </script>
</body>
</html>
