<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Inserir Novo Item - Almoxarifado</title>

    <style>
        :root {
            --primary: #00437e;
            --primary-hover: #002d54;
            --success: #28a745;
            --success-hover: #218838;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border: #cbd5e1;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: url(/static/img/tela2.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        /* Top Navigation */
        .top-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 67, 126, 0.3);
            transition: all 0.3s ease;
        }

        .voltar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 67, 126, 0.4);
        }

        /* Área Central do Formulário */
        .form-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        .card-form {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 30, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.7);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-icone {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .card-header h1 {
            color: var(--primary);
            font-size: clamp(22px, 3.5vw, 30px);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 14px;
            color: #64748b;
            margin: 0;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 48px;
            box-sizing: border-box;
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--border);
            font-size: 15px;
            outline: none;
            background: #ffffff;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 67, 126, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
            font-size: 14px;
        }

        .btn-submit {
            margin-top: 15px;
            width: 100%;
            height: 52px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--success);
            color: white;
            font-size: 17px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(40, 167, 69, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--success-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(40, 167, 69, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Rodapé */
        .page-footer {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* ========================================================
           MEDIA QUERIES - RESPONSIVIDADE
           ======================================================== */

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .card-form {
                padding: 30px 22px;
                border-radius: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .voltar {
                font-size: 13px;
                padding: 8px 16px;
            }

            .card-form {
                padding: 24px 16px;
                border-radius: 14px;
            }

            .card-icone {
                font-size: 32px;
            }

            .card-header h1 {
                font-size: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            input {
                height: 46px;
                font-size: 15px;
            }

            .btn-submit {
                height: 48px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="{{ url_for('menu') }}" class="voltar">⬅ Voltar ao Menu</a>
    </header>

    <main class="form-wrapper">
        <div class="card-form">
            <div class="card-header">
                <h1>Adicionar Novo Item</h1>
            </div>

            <form action="{{ url_for('adicionaritem') }}" method="POST">
                <div class="form-group">
                    <label for="nome" class="form-label">Nome do Item</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Ex: Mouse Sem Fio" 
                        required 
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input 
                        type="text" 
                        id="descricao" 
                        name="descricao" 
                        placeholder="Ex: Modelo Ergonômico USB" 
                        required 
                        autocomplete="off"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="qtd" class="form-label">Quantidade</label>
                        <input 
                            type="number" 
                            id="qtd" 
                            name="qtd" 
                            placeholder="Ex: 25" 
                            required 
                            min="1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input 
                            type="number" 
                            id="preco" 
                            step="0.01" 
                            name="preco" 
                            placeholder="Ex: 49.90" 
                            required 
                            min="0"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Adicionar ao Estoque</span> ➔
                </button>
            </form>
        </div>
    </main>

</body>
</html>
